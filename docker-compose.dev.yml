version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: fareshare-postgres
    environment:
      - POSTGRES_DB=fareshare
      - POSTGRES_USER=fareshare_user
      - POSTGRES_PASSWORD=fareshare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fareshare_user -d fareshare"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fareshare-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - HOT_RELOAD=1
      - DATABASE_URL=postgresql://fareshare_user:fareshare_password@postgres:5432/fareshare
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: fareshare-frontend
    ports:
      - "3000:5173"
    environment:
      - HOT_RELOAD=1
      - VITE_BACKEND_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    networks:
      - fareshare-network

networks:
  fareshare-network:
    driver: bridge

volumes:
  postgres_data:
